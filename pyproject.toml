[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemstudio"
version = "0.3.0"
description = "ChemStudio desktop application for chemical and material data management."
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=1.26,<2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "PySide6>=6.7",
  "PySide6-Addons>=6.7",
  "rdkit>=2024.3",
  "scikit-learn>=1.5",
  "mordred>=1.2.0",
]

[project.optional-dependencies]
boost = ["xgboost>=2.1"]
dev = ["pytest>=8.0"]

[project.scripts]
chemstudio = "chemstudio.app:main"

[tool.pytest.ini_options]
testpaths = ["chemstudio/tests"]

[tool.setuptools.packages.find]
include = ["chemstudio*"]

[tool.setuptools.package-data]
"chemstudio.resources" = ["*.csv"]
