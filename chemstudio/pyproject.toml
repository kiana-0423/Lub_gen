[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemstudio"
version = "0.1.0"
description = "Windows desktop MVP for molecule modeling and analysis."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["chemstudio/tests"]

[tool.setuptools.packages.find]
include = ["chemstudio*"]

